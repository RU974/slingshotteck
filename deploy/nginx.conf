# Nginx config for the Slingshotteck site (static files from `npm run build`).
# Copy the CONTENTS of dist/ to /var/www/slingshotteck (or change `root` below),
# put this file in /etc/nginx/sites-available/, link it into sites-enabled, then
# `sudo nginx -t && sudo systemctl reload nginx`. Add HTTPS with certbot:
#   sudo certbot --nginx -d slingshotteck.com -d www.slingshotteck.com

# Serve image.png.webp instead of image.png to browsers that accept WebP.
map $http_accept $webp_suffix {
    default "";
    "~*webp" ".webp";
}

# Cache policy by path. Hashed JS/CSS bundles never change; HTML is always
# revalidated so a new deploy shows up immediately.
map $uri $cache_control {
    ~^/assets/                          "public, max-age=31536000, immutable";
    ~^/images/                          "public, max-age=2592000";
    ~*\.(mp4|webm|ico|svg|woff2?)$      "public, max-age=2592000";
    default                             "public, max-age=0, must-revalidate";
}

server {
    listen 80;
    server_name slingshotteck.com;
    return 301 https://www.slingshotteck.com$request_uri;
}

server {
    listen 80;
    server_name www.slingshotteck.com;

    root /var/www/slingshotteck;
    index index.html;
    charset utf-8;

    # Headers are set here only (an add_header inside a location would drop these).
    add_header Cache-Control $cache_control;
    add_header Vary Accept;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Old URLs that moved
    location = /features { return 301 /services; }
    location = /elements { return 301 /; }

    # Strip trailing slashes (/about/ -> /about)
    rewrite ^/(.+)/$ /$1 permanent;

    # Clean URLs: /about is served from about.html. Unknown URLs get the 404 page,
    # which the React app also renders when navigating in the browser.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;

    location /images/ {
        try_files $uri$webp_suffix $uri =404;
    }
}
